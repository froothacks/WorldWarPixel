[project]
name = "worldwarpixel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leon Fattakhov", email = "leonfattakhov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.126",
    "fastapi>=0.162.0",
    "openai>=3.46.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1.0"]

[project.scripts]
worldwarpixel = "worldwarpixel:main"
worldwarpixel-personas = "worldwarpixel.personas.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "numpy", "numpy.*"]
ignore_missing_imports = true
