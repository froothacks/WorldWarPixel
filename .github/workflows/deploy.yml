name: Deploy

# After CI passes for a push to main (or on demand), deploy the always-on web container to Modal
# (retiring the legacy Sandbox) and to Cloud Run. Each target is skipped while its repo secrets are
# unset: MODAL_TOKEN_ID / MODAL_TOKEN_SECRET for Modal (app settings live in the `worldwarpixel`
# Modal secret), and GCP_SA_KEY (deployer service-account JSON) for Cloud Run. Cloud Run reads app
# secrets from Secret Manager by name; optional GCP_APP_ENV holds only non-secret settings.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  modal:
    # Only pushes to this repo's main: a fork PR from a branch named main also matches `branches`.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::notice::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET not set; skipping deploy"
          elif [ -n "$TESTED_SHA" ] && [ "$TESTED_SHA" != "$(git rev-parse HEAD)" ]; then
            # main moved on; the CI run for the newer commit deploys instead (no rollbacks).
            echo "::notice::$TESTED_SHA is no longer main's head; skipping deploy"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.gate.outputs.go == 'true'
        run: uv run --with modal==1.6.3 python deploy/modal_app.py retire
      - if: steps.gate.outputs.go == 'true'
        run: uv run --with modal==1.6.3 modal deploy deploy/modal_app.py

  cloudrun:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GCP_APP_ENV: ${{ secrets.GCP_APP_ENV }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::notice::GCP_SA_KEY not set; skipping Cloud Run deploy"
          elif [ -n "$TESTED_SHA" ] && [ "$TESTED_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "::notice::$TESTED_SHA is no longer main's head; skipping deploy"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - if: steps.gate.outputs.go == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - if: steps.gate.outputs.go == 'true'
        env:
          GCP_APP_ENV: ${{ secrets.GCP_APP_ENV }}
        run: |
          if [ -n "$GCP_APP_ENV" ]; then
            # Outside the checkout so the build context never contains app settings.
            printf '%s\n' "$GCP_APP_ENV" > "$RUNNER_TEMP/app.env"
            APP_ENV_FILE="$RUNNER_TEMP/app.env" deploy/cloudrun.sh
          else
            deploy/cloudrun.sh
          fi
